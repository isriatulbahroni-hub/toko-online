<!doctype html>
<html lang='id'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Toko Online</title>
<meta name='description' content='Toko songket online: kain songket, selendang, dan busana tenun.'>
<meta property='og:title' content='Garery Songket Sari Melati'><meta property='og:type' content='website'>
<link rel='icon' href='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%A7%B5%3C/text%3E%3C/svg%3E'>
<style>
:root{--o:#ee4d2d;--bg:#f5f5f5;--tx:#222;--mut:#757575;--bd:#e8e8e8}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--tx)}
:focus-visible{outline:2px solid #1a73e8;outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:linear-gradient(#f53d2d,var(--o));display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:10px 16px}
header a{color:#fff;text-decoration:none;font-weight:600}
#brand{font-size:20px}
#cari{flex:1 1 260px;max-width:640px;display:flex;background:#fff;border-radius:4px;padding:3px}
#cari input{flex:1;min-width:0;border:0;padding:8px 10px;font:inherit;background:none;outline:0}
#cari button{padding:8px 18px}
header nav{display:flex;flex-wrap:wrap;gap:6px 16px;margin-left:auto}
main{max-width:1200px;margin:auto;padding:12px}
h3{margin:16px 0 8px}
button,.btn{background:var(--o);color:#fff;border:0;border-radius:4px;padding:10px 16px;font:inherit;cursor:pointer;text-decoration:none;display:inline-block}
button:disabled{opacity:.5}
.line{background:#fff;color:var(--o);border:1px solid var(--o)}
.fm{max-width:420px;margin:auto}
.fm input,.fm textarea{width:100%;padding:10px;margin:4px 0 10px;border:1px solid #ccc;border-radius:6px;font:inherit}
.fm a{color:var(--o)}
#err{color:#c0392b}.ok{color:#1e8449}
.kolom{display:grid;grid-template-columns:210px minmax(0,1fr) 250px;gap:12px;align-items:start}
.kolom.dua{grid-template-columns:210px minmax(0,1fr)}
@media(max-width:960px){.kolom,.kolom.dua{grid-template-columns:minmax(0,1fr)}.kat div{display:flex;gap:8px;overflow-x:auto;margin-top:8px}.kat a{white-space:nowrap;border:1px solid var(--bd);border-radius:16px}}
.box{background:#fff;border-radius:6px;padding:12px;margin-bottom:12px}
.kat a{display:block;padding:8px 10px;text-decoration:none;color:inherit;border-radius:4px}
.kat a.on,.kat a:hover{color:var(--o);background:#fff3f0}
.ban{background:linear-gradient(120deg,#2b2140,#5b2a86 55%,var(--o));color:#fff;border-radius:6px;padding:28px 24px 36px;min-height:190px;position:relative;margin-bottom:12px}
.sl{display:none;max-width:520px}.sl.on{display:block}
.sl h2{font-size:clamp(22px,3.4vw,34px);line-height:1.15;margin:0 0 8px}.sl p{margin:0 0 16px;opacity:.9}
.dots{position:absolute;left:24px;bottom:12px;display:flex;gap:6px}
.dots i{width:22px;height:5px;background:#fff6;border-radius:3px;cursor:pointer}.dots i.on{background:#fff}
.ung{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{display:block;background:#fff;border-radius:6px;overflow:hidden;text-decoration:none;color:inherit;border:1px solid transparent}
.card:hover{border-color:var(--o)}
.im{position:relative}
.im img,.ph{width:100%;aspect-ratio:1;object-fit:cover;background:#ddd;display:block}
.dsk{position:absolute;top:0;right:0;background:#fdd835;color:var(--o);font-size:12px;padding:2px 6px}
.habis{position:absolute;inset:0;background:#fffa;display:grid;place-items:center;font-weight:600}
.bd{padding:8px}
.nm{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.9em}
.price{color:var(--o);font-weight:600}.price s{color:var(--mut);font-weight:400;font-size:12px}
.det{display:grid;grid-template-columns:minmax(0,420px) 1fr;gap:16px;background:#fff;padding:16px;border-radius:6px}
@media(max-width:700px){.det{grid-template-columns:1fr}}
.big{font-size:24px;margin:8px 0}
.desk{white-space:pre-line}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#fff;padding:10px;border-radius:6px;margin-bottom:8px}
.info{list-style:none;padding:0;margin:8px 0 0}.info li{padding:6px 0;border-top:1px solid var(--bd)}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px}
.chips button{background:#fff;color:var(--tx);border:1px solid var(--bd);border-radius:16px;padding:6px 14px;white-space:nowrap}
.chips button.on{border-color:var(--o);color:var(--o)}
.oh,.oi{display:flex;justify-content:space-between;gap:8px;padding:6px 0}
.oi{border-top:1px solid var(--bd)}
.msg{padding:20px;text-align:center}
footer{text-align:center;color:var(--mut);padding:24px 12px;font-size:13px}
footer a{color:var(--o)}
</style></head><body>
<header><a id='brand' href='#/'>Toko Online</a><form id='cari'><input id='q' placeholder='Cari produk' aria-label='Cari produk' maxlength='80'><button>Cari</button></form><nav><a href='#/keranjang' id='kc'>Keranjang (0)</a><a href='#/pesanan' id='ps' hidden>Pesanan saya</a><a href='#/masuk' id='ak'>Masuk</a></nav></header>
<main id='app'></main>
<footer id='ft'></footer>
<script src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js'></script>
<script src='config.js'></script>
<script>
const C=window.CFG||{},$=s=>document.querySelector(s),app=$('#app');
const rp=n=>'Rp'+Number(n).toLocaleString('id-ID');
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/'/g,'&#39;').split(String.fromCharCode(34)).join('&quot;');
const db=(typeof supabase!=='undefined'&&C.SUPABASE_URL)?supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY):null;
let user=null,KAT=[],PS=[],fp='semua',tm=null;
const ck=()=>user?'cart:'+user.id:null;
const cart={get(){try{return ck()?JSON.parse(localStorage.getItem(ck())||'{}'):{}}catch(e){return{}}},set(c){try{if(ck())localStorage.setItem(ck(),JSON.stringify(c))}catch(e){}upd()}};
function uiAuth(){const a=$('#ak');a.textContent=user?'Keluar':'Masuk';a.href=user?'#/keluar':'#/masuk';$('#ps').hidden=!user}
function perluMasuk(back){try{sessionStorage.setItem('back',back)}catch(e){}location.hash='#/masuk'}
const galat=m=>({'Invalid login credentials':'Email atau kata sandi salah','Email not confirmed':'Cek email Anda dan klik tautan konfirmasi dulu','User already registered':'Email sudah terdaftar, silakan masuk'}[m]||m);
function upd(){$('#kc').textContent='Keranjang ('+Object.values(cart.get()).reduce((s,x)=>s+x.qty,0)+')'}
const STS={baru:['Menunggu pembayaran','#b9770e'],dibayar:['Dibayar','#1e8449'],dikirim:['Dikirim','#2471a3'],selesai:['Selesai','#555'],batal:['Dibatalkan','#c0392b']};

const img=p=>p.image_url?`<img src='${esc(p.image_url)}' alt='${esc(p.name)}' loading='lazy'>`:`<div class='ph'></div>`;
const diskon=p=>p.harga_coret>p.price?Math.round((1-p.price/p.harga_coret)*100):0;
const kartu=p=>`<a class='card' href='#/p/${p.id}'><div class='im'>${img(p)}${diskon(p)?`<b class='dsk'>-${diskon(p)}%</b>`:''}${p.stock<1?`<span class='habis'>Habis</span>`:''}</div><div class='bd'><div class='nm'>${esc(p.name)}</div><div class='price'>${rp(p.price)}${diskon(p)?` <s>${rp(p.harga_coret)}</s>`:''}</div>${p.terjual?`<small>Terjual ${p.terjual}</small>`:''}</div></a>`;
const gridHtml=ps=>ps.length?`<div class='grid'>${ps.map(kartu).join('')}</div>`:`<p class='msg'>Belum ada produk.</p>`;
const namaKat=id=>(KAT.find(k=>k.id===id)||{}).nama||'';
async function muatKat(){if(KAT.length)return;const r=await db.from('categories').select('id,nama').order('urut');KAT=r.data||[]}

async function ambilProduk(f){
 let q=db.from('products').select('id,name,price,harga_coret,image_url,stock,category_id').eq('is_active',true).order('created_at',{ascending:false}).limit(120);
 if(f.kat)q=q.eq('category_id',f.kat);
 if(f.cari)q=q.ilike('name','%'+f.cari.replace(/[%_,()]/g,' ')+'%');
 const[p,t]=await Promise.all([q,db.from('produk_terjual').select('product_id,terjual')]);
 if(p.error)throw p.error;
 const T={};(t.data||[]).forEach(x=>{T[x.product_id]=x.terjual});
 return p.data.map(x=>({...x,terjual:T[x.id]||0}));
}

function rangka(tengah,aktif,kanan){
 return `<div class='kolom${kanan?'':' dua'}'><nav class='kat box'><b>Kategori</b><div><a class='${aktif==='semua'?'on':''}' href='#/semua'>Semua produk</a>${KAT.map(k=>`<a class='${aktif===k.id?'on':''}' href='#/k/${k.id}'>${esc(k.nama)}</a>`).join('')}</div></nav><section>${tengah}</section>${kanan?`<aside>${kanan}</aside>`:''}</div>`;
}
function banner(){
 const B=C.BANNER&&C.BANNER.length?C.BANNER:[{judul:C.NAMA||'Toko Online',sub:'',tombol:'Lihat produk',link:'#/semua'}];
 return `<div class='ban' id='ban'>${B.map((b,i)=>`<div class='sl${i?'':' on'}'><h2>${esc(b.judul)}</h2><p>${esc(b.sub||'')}</p><a class='btn' href='${esc(b.link||'#/semua')}'>${esc(b.tombol||'Lihat produk')}</a></div>`).join('')}${B.length>1?`<div class='dots'>${B.map((_,i)=>`<i data-d='${i}' class='${i?'':'on'}'></i>`).join('')}</div>`:''}</div>`;
}
function putarBanner(){
 const el=$('#ban');if(!el)return;
 const s=[...el.querySelectorAll('.sl')],d=[...el.querySelectorAll('.dots i')];if(s.length<2)return;
 let n=0;const go=k=>{n=(k+s.length)%s.length;s.forEach((x,i)=>x.classList.toggle('on',i===n));d.forEach((x,i)=>x.classList.toggle('on',i===n))};
 d.forEach((x,i)=>{x.onclick=()=>go(i)});
 if(!matchMedia('(prefers-reduced-motion:reduce)').matches)tm=setInterval(()=>go(n+1),5000);
}
function panelKanan(){
 const nama=user?esc((user.user_metadata||{}).nama||user.email):'';
 const akun=user?`<div class='box'><b>Halo, ${nama}</b><p><a href='#/pesanan'>Pesanan saya</a><br><a href='#/keranjang'>Keranjang</a></p></div>`:`<div class='box'><b>Selamat datang</b><p>Masuk untuk membeli dan memantau pesanan.</p><a class='btn' href='#/masuk'>Masuk</a> <a class='btn line' href='#/daftar'>Daftar</a></div>`;
 const info=(C.PENGUMUMAN||[]).map(x=>`<li>${esc(x.judul)}${x.tgl?`<br><small>${esc(x.tgl)}</small>`:''}</li>`).join('');
 return akun+(info?`<div class='box'><b>Pengumuman</b><ul class='info'>${info}</ul></div>`:'');
}

async function beranda(){
 const ps=await ambilProduk({});
 const laris=ps.filter(x=>x.terjual>0).sort((a,b)=>b.terjual-a.terjual).slice(0,6);
 const ung=(C.KEUNGGULAN||[]).map(u=>`<div><b>${esc(u[0])}</b><br><small>${esc(u[1]||'')}</small></div>`).join('');
 app.innerHTML=rangka(banner()+(ung?`<div class='box ung'>${ung}</div>`:'')+(laris.length?`<h3>Produk terlaris</h3><div class='grid'>${laris.map(kartu).join('')}</div>`:'')+`<h3>Produk terbaru</h3>`+gridHtml(ps),'',panelKanan());
 putarBanner();
}
async function daftar(f,judul,aktif){
 const ps=await ambilProduk(f);
 app.innerHTML=rangka(`<h3>${esc(judul)}</h3>`+(ps.length?gridHtml(ps):`<p class='msg'>Produk tidak ditemukan.</p>`),aktif);
}
async function detail(id){
 const{data:p,error}=await db.from('products').select('*').eq('id',id).single();
 if(error)throw error;
 const t=await db.from('produk_terjual').select('terjual').eq('product_id',id).maybeSingle();
 const sold=(t.data||{}).terjual||0,d=diskon(p),kn=namaKat(p.category_id);
 app.innerHTML=`<p><a href='#/'>Beranda</a>${kn?` / <a href='#/k/${p.category_id}'>${esc(kn)}</a>`:''}</p><div class='det'><div>${img(p)}</div><div><h2>${esc(p.name)}</h2><p class='price big'>${rp(p.price)}${d?` <s>${rp(p.harga_coret)}</s> <b class='dsk'>-${d}%</b>`:''}</p>${sold?`<p>Terjual ${sold}</p>`:''}<p>Stok: ${p.stock}</p><p class='desk'>${esc(p.description)}</p>`+(p.stock>0?`<button id='add'>${user?'Tambah ke keranjang':'Masuk untuk membeli'}</button>`:`<p><b>Stok habis</b></p>`)+`</div></div>`;
 const b=$('#add');
 if(b)b.onclick=()=>{if(!user){perluMasuk('#/p/'+p.id);return}const c=cart.get();c[p.id]={name:p.name,price:p.price,stock:p.stock,qty:Math.min(((c[p.id]||{}).qty||0)+1,p.stock)};cart.set(c);b.textContent='Masuk keranjang'};
}
function cartView(){
 const c=cart.get(),ids=Object.keys(c);
 if(!ids.length){app.innerHTML=`<p class='msg'>Keranjang kosong. <a href='#/'>Mulai belanja</a></p>`;return}
 const total=ids.reduce((s,i)=>s+c[i].price*c[i].qty,0);
 app.innerHTML=`<h2>Keranjang</h2>`+ids.map(i=>`<div class='row'><span>${esc(c[i].name)}<br><small>${rp(c[i].price)}</small></span><span><button data-a='-' data-i='${i}'>-</button> ${c[i].qty} <button data-a='+' data-i='${i}'>+</button></span></div>`).join('')+`<p class='price'>Total: ${rp(total)}</p><a class='btn' href='#/checkout'>Checkout</a>`;
}
function authView(dft){
 app.innerHTML=`<form id='af' class='fm'><h2>${dft?'Daftar':'Masuk'}</h2>`+(dft?`<input name='n' placeholder='Nama lengkap' maxlength='100' required>`:'')+`<input name='e' type='email' placeholder='Email' required><input name='p' type='password' placeholder='Kata sandi (minimal 8 karakter)' minlength='8' required><button>${dft?'Daftar':'Masuk'}</button><p id='err'></p><p>${dft?`Sudah punya akun? <a href='#/masuk'>Masuk</a>`:`Belum punya akun? <a href='#/daftar'>Daftar</a>`}</p></form>`;
 $('#af').onsubmit=async e=>{
  e.preventDefault();const f=e.target,btn=f.querySelector('button');btn.disabled=true;$('#err').textContent='';
  const cred={email:f.elements.e.value.trim(),password:f.elements.p.value};
  const r=dft?await db.auth.signUp({...cred,options:{data:{nama:f.elements.n.value.trim()}}}):await db.auth.signInWithPassword(cred);
  if(r.error){$('#err').textContent=galat(r.error.message);btn.disabled=false;return}
  if(!r.data.session){f.innerHTML=`<p class='ok'>Pendaftaran berhasil. Cek email Anda dan klik tautan konfirmasi, lalu <a href='#/masuk'>masuk</a>.</p>`;return}
  user=r.data.session.user;uiAuth();upd();
  let back='#/';try{back=sessionStorage.getItem('back')||'#/';sessionStorage.removeItem('back')}catch(x){}
  location.hash=back;
 };
}
async function checkout(){
 const c=cart.get(),ids=Object.keys(c);
 if(!ids.length){location.hash='#/keranjang';return}
 const pr=(await db.from('profiles').select('nama,telp,alamat').eq('id',user.id).maybeSingle()).data||{};
 app.innerHTML=`<form id='f' class='fm'><h2>Checkout</h2><input name='n' placeholder='Nama' maxlength='100' value='${esc(pr.nama||(user.user_metadata||{}).nama||'')}' required><input name='t' type='tel' placeholder='No. WhatsApp' pattern='[0-9+ -]{8,20}' value='${esc(pr.telp)}' required><textarea name='a' rows='3' placeholder='Alamat lengkap' minlength='10' maxlength='500' required>${esc(pr.alamat)}</textarea><button>Buat pesanan</button><p id='err'></p></form>`;
 $('#f').onsubmit=async e=>{
  e.preventDefault();const f=e.target,btn=f.querySelector('button');btn.disabled=true;
  const{data,error}=await db.rpc('buat_pesanan',{p_nama:f.elements.n.value,p_telp:f.elements.t.value,p_alamat:f.elements.a.value,p_items:ids.map(i=>({id:i,qty:c[i].qty}))});
  if(error){$('#err').textContent=error.message;btn.disabled=false;return}
  const o=data[0],nl=String.fromCharCode(10);
  const txt=['Pesanan '+String(o.order_id).slice(0,8)].concat(ids.map(i=>c[i].qty+'x '+c[i].name),['Total '+rp(o.total),'Nama: '+f.elements.n.value,'Telp: '+f.elements.t.value,'Alamat: '+f.elements.a.value]).join(nl);
  cart.set({});
  app.innerHTML=`<p class='msg'>Pesanan dibuat. Total ${rp(o.total)}.</p>`+(C.WA?`<p class='msg'><a class='btn' href='https://wa.me/${esc(C.WA)}?text=${encodeURIComponent(txt)}'>Konfirmasi via WhatsApp</a></p>`:'')+`<p class='msg'><a href='#/pesanan'>Lihat pesanan saya</a></p>`;
 };
}
function pesananView(){
 const daf=PS.filter(o=>fp==='semua'||o.status===fp);
 const chips=['semua','baru','dibayar','dikirim','selesai','batal'].map(s=>`<button data-f='${s}' class='${s===fp?'on':''}'>${s==='semua'?'Semua':STS[s][0]}</button>`).join('');
 app.innerHTML=`<h2>Pesanan saya</h2><div class='chips'>${chips}</div>`+(daf.length?daf.map(o=>{
  const[lb,wr]=STS[o.status]||[o.status,'#555'],id8=String(o.id).slice(0,8);
  const tgl=new Date(o.created_at).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'});
  const wa=C.WA?`<a class='btn line' href='https://wa.me/${esc(C.WA)}?text=${encodeURIComponent('Halo, saya mau konfirmasi pesanan '+id8+' (total '+rp(o.total)+')')}'>Konfirmasi via WhatsApp</a>`:'';
  return `<div class='box'><div class='oh'><span>Pesanan ${id8} <small>${tgl}</small></span><b style='color:${wr}'>${lb}</b></div>${o.order_items.map(i=>`<div class='oi'><span>${esc(i.name)} <small>x${i.qty}</small></span><span>${rp(i.price*i.qty)}</span></div>`).join('')}<div class='oi'><span>Total</span><b class='price'>${rp(o.total)}</b></div>${o.status==='baru'?`<p>${wa} <button class='line' data-batal='${o.id}'>Batalkan pesanan</button></p>`:''}</div>`;
 }).join(''):`<p class='msg'>${PS.length?'Tidak ada pesanan dengan status ini.':`Belum ada pesanan. <a href='#/'>Mulai belanja</a>`}</p>`);
}
async function pesananSaya(){
 const r=await db.from('orders').select('id,status,total,created_at,order_items(name,qty,price)').eq('buyer_id',user.id).order('created_at',{ascending:false});
 if(r.error)throw r.error;
 PS=r.data;pesananView();
}

app.onclick=async e=>{
 const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.a){const c=cart.get(),i=d.i;c[i].qty=Math.min(c[i].qty+(d.a==='+'?1:-1),c[i].stock||99);if(c[i].qty<1)delete c[i];cart.set(c);cartView()}
 else if(d.f){fp=d.f;pesananView()}
 else if(d.batal){
  if(!confirm('Batalkan pesanan ini?'))return;
  b.disabled=true;const r=await db.rpc('batalkan_pesanan_saya',{p_order:d.batal});
  if(r.error){alert(r.error.message);b.disabled=false;return}
  try{await pesananSaya()}catch(x){app.innerHTML=`<p class='msg'>Gagal: ${esc(x.message)}</p>`}
 }
};
$('#cari').onsubmit=e=>{e.preventDefault();const q=$('#q').value.trim();location.hash=q?'#/cari/'+encodeURIComponent(q):'#/semua'};

async function route(){
 clearInterval(tm);
 const h=location.hash.slice(1)||'/';
 if(!db){app.innerHTML=`<p class='msg'>Isi config.js dengan URL dan anon key Supabase.</p>`;return}
 app.innerHTML=`<p class='msg'>Memuat...</p>`;scrollTo(0,0);
 try{
  await muatKat();
  if(!h.startsWith('/cari/'))$('#q').value='';
  if(h==='/')await beranda();
  else if(h==='/semua')await daftar({},'Semua produk','semua');
  else if(h.startsWith('/k/')){const id=h.slice(3);await daftar({kat:id},namaKat(id)||'Kategori',id)}
  else if(h.startsWith('/cari/')){const q=decodeURIComponent(h.slice(6));$('#q').value=q;await daftar({cari:q},'Hasil pencarian: '+q,'')}
  else if(h.startsWith('/p/'))await detail(h.slice(3));
  else if(h==='/masuk'||h==='/daftar'){if(user)location.hash='#/';else authView(h==='/daftar')}
  else if(h==='/keluar'){await db.auth.signOut();user=null;uiAuth();upd();location.hash='#/'}
  else if(h==='/keranjang'||h==='/checkout'||h==='/pesanan'){
   if(!user)perluMasuk('#'+h);
   else if(h==='/keranjang')cartView();
   else if(h==='/checkout')await checkout();
   else{fp='semua';await pesananSaya()}
  }
  else app.innerHTML=`<p class='msg'>Halaman tidak ditemukan.</p>`;
