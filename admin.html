<!doctype html>
<html lang='id'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><meta name='robots' content='noindex'><title>Admin</title>
<style>
body{margin:0;font:16px system-ui,sans-serif;background:#f6f6f6;color:#222}
header{position:sticky;top:0;background:#333;color:#fff;display:flex;justify-content:space-between;padding:12px 16px}
header a{color:#fff}
main{max-width:700px;margin:auto;padding:12px}
button{background:#ee4d2d;color:#fff;border:0;border-radius:6px;padding:10px 14px;font-size:16px;margin:2px}
button:disabled{opacity:.5}
input,textarea,select{width:100%;box-sizing:border-box;padding:10px;margin:4px 0 10px;border:1px solid #ccc;border-radius:6px;font:inherit}
select{width:auto;margin:4px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#fff;padding:10px;border-radius:8px;margin:8px 0}
.msg{padding:20px;text-align:center}
</style></head><body>
<header><b>Admin</b><span id='out'></span></header>
<main id='app'></main>
<script src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js'></script>
<script src='config.js'></script>
<script>
const C=window.CFG,$=s=>document.querySelector(s),app=$('#app');
const rp=n=>'Rp'+Number(n).toLocaleString('id-ID');
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/'/g,'&#39;').split(String.fromCharCode(34)).join('&quot;');
const db=supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY);
const msg=t=>{const m=$('#m');if(m)m.textContent=t};
let seller=null,P=[],CAT=[];

async function init(){const r=await db.auth.getSession();r.data.session?panel():login()}
function login(){
 $('#out').textContent='';
 app.innerHTML=`<form id='f'><input name='e' type='email' placeholder='Email' required><input name='p' type='password' placeholder='Kata sandi' required><button>Masuk</button><p id='m'></p></form>`;
 $('#f').onsubmit=async e=>{e.preventDefault();const r=await db.auth.signInWithPassword({email:e.target.e.value,password:e.target.p.value});if(r.error)msg(r.error.message);else panel()};
}
async function panel(){
 const u=(await db.auth.getUser()).data.user;
 $('#out').innerHTML=`<a href='#' id='lo'>Keluar</a>`;
 $('#lo').onclick=async e=>{e.preventDefault();await db.auth.signOut();login()};
 const r=await db.from('sellers').select('*').eq('owner_id',u.id).maybeSingle();
 if(!r.data){app.innerHTML=`<p class='msg'>Akun ${esc(u.email)} belum ditautkan ke toko.</p>`;return}
 seller=r.data;CAT=(await db.from('categories').select('id,nama').order('urut')).data||[];tab('produk');
}
function tab(t){app.innerHTML=`<p><button data-t='produk'>Produk</button><button data-t='pesanan'>Pesanan</button><button data-t='atur'>Pengaturan</button></p><div id='box'></div>`;t==='produk'?produk():t==='pesanan'?pesanan():atur();cekBaru()}
let lastBaru=null;
function bunyi(){try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator();o.connect(a.destination);o.frequency.value=880;o.start();o.stop(a.currentTime+.25)}catch(e){}}
async function cekBaru(){
 if(!seller)return;
 const r=await db.from('orders').select('id',{count:'exact',head:true}).eq('seller_id',seller.id).eq('status','baru');
 if(r.error)return;
 const n=r.count||0,b=document.querySelector("button[data-t='pesanan']");
 if(b)b.textContent='Pesanan'+(n?' ('+n+' baru)':'');
 document.title=(n?'('+n+') ':'')+'Admin';
 if(lastBaru!==null&&n>lastBaru){bunyi();try{if(window.Notification&&Notification.permission==='granted')new Notification('Pesanan baru, '+n+' menunggu')}catch(e){}}
 lastBaru=n;
}
setInterval(cekBaru,30000);
async function produk(){
 const r=await db.from('products').select('*').eq('seller_id',seller.id).order('created_at',{ascending:false});
 if(r.error){$('#box').textContent=r.error.message;return}
 P=r.data;
 $('#box').innerHTML=`<button data-a='baru'>+ Produk baru</button>`+P.map(p=>`<div class='row'><span>${esc(p.name)}<br><small>${rp(p.price)} | stok ${p.stock} | ${p.is_active?'tayang':'disembunyikan'}</small></span><button data-a='edit' data-i='${p.id}'>Ubah</button></div>`).join('');
}
function form(p){
 p=p||{};
 $('#box').innerHTML=`<form id='pf'><input name='name' placeholder='Nama produk' value='${esc(p.name)}' required><textarea name='description' rows='3' placeholder='Deskripsi'>${esc(p.description)}</textarea><input name='price' type='number' min='0' placeholder='Harga (Rp)' value='${p.price==null?'':p.price}' required><input name='harga_coret' type='number' min='0' placeholder='Harga coret / sebelum diskon (opsional)' value='${p.harga_coret==null?'':p.harga_coret}'><input name='stock' type='number' min='0' placeholder='Stok' value='${p.stock==null?0:p.stock}' required><select name='category_id' style='width:100%'><option value=''>Tanpa kategori</option>${CAT.map(k=>`<option value='${k.id}'${k.id===p.category_id?' selected':''}>${esc(k.nama)}</option>`).join('')}</select><input name='file' type='file' accept='image/*'><label><input type='checkbox' name='is_active' style='width:auto' ${p.is_active===false?'':'checked'}> Tayang</label><br><button>Simpan</button><button type='button' data-a='batal'>Batal</button><p id='m'></p></form>`;
 $('#pf').onsubmit=async e=>{
  e.preventDefault();const el=e.target.elements,b=e.target.querySelector('button');b.disabled=true;
  try{
   let url=p.image_url||null;const file=el['file'].files[0];
   if(file){
    const path=seller.id+'/'+Date.now()+'-'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
    const up=await db.storage.from('produk').upload(path,file);if(up.error)throw up.error;
    url=db.storage.from('produk').getPublicUrl(path).data.publicUrl;
   }
   const row={seller_id:seller.id,name:el['name'].value.trim(),description:el['description'].value,price:+el['price'].value,stock:+el['stock'].value,harga_coret:el['harga_coret'].value?+el['harga_coret'].value:null,category_id:el['category_id'].value||null,image_url:url,is_active:el['is_active'].checked};
   const r=p.id?await db.from('products').update(row).eq('id',p.id):await db.from('products').insert(row);
   if(r.error)throw r.error;
   produk();
  }catch(err){msg(err.message);b.disabled=false}
 };
}
let O=[],ONGKIR=[],filterP='semua';
const NEXT={baru:['dibayar','batal'],dibayar:['dikirim','batal'],dikirim:['selesai'],selesai:[],batal:[]};
const nomorWA=t=>{let d=String(t).replace(/\D/g,'');if(d.startsWith('0'))d='62'+d.slice(1);return d};
function kartuPesanan(o){
 const next=NEXT[o.status]||[];
 return `<div class='row' style='display:block'><b>${esc(o.buyer_name)}</b> <a href='https://wa.me/${nomorWA(o.buyer_phone)}' target='_blank' rel='noopener'>${esc(o.buyer_phone)}</a><br><small>${esc(o.address)}</small><br>${o.order_items.map(i=>i.qty+'x '+esc(i.name)).join(', ')}<br>${o.ongkir>0?`<small>Ongkir ${esc(o.wilayah||'')}: ${rp(o.ongkir)}</small><br>`:''}<b>${rp(o.total)}</b> <small>(${esc(o.status)})</small>${o.resi?`<br><small>${esc(o.kurir||'')} resi ${esc(o.resi)}</small>`:''}${o.bukti_path?`<br><button data-a='bukti' data-p='${esc(o.bukti_path)}'>Lihat bukti bayar</button>`:(o.status==='baru'?`<br><small>Belum ada bukti bayar</small>`:'')}${next.length?`<br><select data-o='${o.id}'><option value=''>Ubah status...</option>${next.map(x=>`<option value='${x}'>${x}</option>`).join('')}</select>`:''}</div>`;
}
async function pesanan(){
 const r=await db.from('orders').select('*,order_items(name,qty,price)').eq('seller_id',seller.id).order('created_at',{ascending:false});
 if(r.error){$('#box').textContent=r.error.message;return}
 O=r.data;
 const chips=['semua','baru','dibayar','dikirim','selesai','batal'].map(x=>`<button data-f='${x}'${x===filterP?'':" style='background:#999'"}>${x}</button>`).join('');
 const daf=O.filter(o=>filterP==='semua'||o.status===filterP);
 $('#box').innerHTML=`<p>${chips}</p>`+(daf.length?daf.map(kartuPesanan).join(''):`<p class='msg'>Tidak ada pesanan.</p>`);
}
async function atur(){
 const[o,k]=await Promise.all([db.from('ongkir').select('*').order('urut').order('wilayah'),db.from('categories').select('*').order('urut').order('nama')]);
 ONGKIR=o.data||[];CAT=k.data||[];
 $('#box').innerHTML=`<form id='sf'><h3>Info toko</h3><input name='name' maxlength='100' placeholder='Nama toko' value='${esc(seller.name)}' required><input name='wa' placeholder='WhatsApp (628xxx)' value='${esc(seller.wa)}'><textarea name='rekening' rows='3' maxlength='300' placeholder='Rekening pembayaran (contoh: BCA 1234567 a.n. Nama)'>${esc(seller.rekening)}</textarea><textarea name='kebijakan' rows='5' maxlength='3000' placeholder='Kebijakan toko: pengiriman, retur, jam layanan'>${esc(seller.kebijakan)}</textarea><button>Simpan info toko</button> <small id='m'></small></form>`
 +`<h3>Ongkir per wilayah</h3>`+ONGKIR.map(x=>`<div class='row'><span>${esc(x.wilayah)}<br><small>${rp(x.tarif)}</small></span><span><button data-a='ongubah' data-i='${x.id}'>Ubah</button><button data-a='onghapus' data-i='${x.id}'>Hapus</button></span></div>`).join('')
 +`<form id='of'><input name='w' maxlength='80' placeholder='Wilayah (mis. Palembang)' required><input name='t' type='number' min='0' placeholder='Tarif (Rp)' required><button>Tambah wilayah</button></form>`
 +`<h3>Kategori</h3>`+CAT.map(x=>`<div class='row'><span>${esc(x.nama)}</span><span><button data-a='katubah' data-i='${x.id}'>Ubah nama</button><button data-a='kathapus' data-i='${x.id}'>Hapus</button></span></div>`).join('')
 +`<form id='kf'><input name='n' maxlength='60' placeholder='Nama kategori' required><button>Tambah kategori</button></form>`;
 $('#sf').onsubmit=async e=>{e.preventDefault();const el=e.target.elements;
  const r=await db.from('sellers').update({name:el['name'].value.trim(),wa:el['wa'].value.trim()||null,rekening:el['rekening'].value,kebijakan:el['kebijakan'].value}).eq('id',seller.id).select().single();
  if(r.error)msg(r.error.message);else{seller=r.data;msg('Tersimpan')}};
 $('#of').onsubmit=async e=>{e.preventDefault();const el=e.target.elements;
  const r=await db.from('ongkir').insert({wilayah:el['w'].value.trim(),tarif:+el['t'].value});
  if(r.error)alert(r.error.message);atur()};
 $('#kf').onsubmit=async e=>{e.preventDefault();
  const r=await db.from('categories').insert({nama:e.target.elements['n'].value.trim(),urut:CAT.length+1});
  if(r.error)alert(r.error.message);atur()};
}
app.onclick=async e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(window.Notification&&Notification.permission==='default')Notification.requestPermission();
 if(d.t)tab(d.t);else if(d.a==='baru')form();else if(d.a==='edit')form(P.find(x=>x.id===d.i));else if(d.a==='batal')produk();
 else if(d.f){filterP=d.f;pesanan()}
 else if(d.a==='bukti'){const w=window.open('about:blank','_blank');const r=await db.storage.from('bukti').createSignedUrl(d.p,300);if(r.error){if(w)w.close();alert(r.error.message)}else if(w)w.location=r.data.signedUrl}
 else if(d.a==='ongubah'){const x=ONGKIR.find(y=>y.id===d.i),t=prompt('Tarif baru untuk '+x.wilayah+' (Rp)',x.tarif);if(t===null)return;if(!/^[0-9]+$/.test(t.trim())){alert('Isi dengan angka');return}const r=await db.from('ongkir').update({tarif:+t}).eq('id',d.i);if(r.error)alert(r.error.message);atur()}
 else if(d.a==='onghapus'){if(!confirm('Hapus wilayah ini?'))return;const r=await db.from('ongkir').delete().eq('id',d.i);if(r.error)alert(r.error.message);atur()}
 else if(d.a==='katubah'){const x=CAT.find(y=>y.id===d.i),n=prompt('Nama kategori',x.nama);if(n===null||!n.trim())return;const r=await db.from('categories').update({nama:n.trim()}).eq('id',d.i);if(r.error)alert(r.error.message);atur()}
 else if(d.a==='kathapus'){if(!confirm('Hapus kategori ini? Produknya jadi tanpa kategori.'))return;const r=await db.from('categories').delete().eq('id',d.i);if(r.error)alert(r.error.message);atur()}};
app.onchange=async e=>{const sel=e.target.closest('select[data-o]');if(!sel||!sel.value)return;
 const ubah={status:sel.value};
 if(sel.value==='dikirim'){const k=prompt('Nama kurir (mis. JNE)');if(k===null){pesanan();return}const rs=prompt('Nomor resi');if(rs===null){pesanan();return}ubah.kurir=(k||'').trim()||null;ubah.resi=(rs||'').trim()||null}
 else if(sel.value==='batal'&&!confirm('Batalkan pesanan ini? Stok akan dikembalikan.')){pesanan();return}
 const r=await db.from('orders').update(ubah).eq('id',sel.dataset.o);
 if(r.error)alert(r.error.message);
 pesanan();cekBaru()};
init();
</script></body></html>
