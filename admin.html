<!doctype html>
<html lang='id'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><meta name='robots' content='noindex'><title>Admin</title>
<style>
body{margin:0;font:16px system-ui,sans-serif;background:#f6f6f6;color:#222}
header{position:sticky;top:0;background:#333;color:#fff;display:flex;justify-content:space-between;padding:12px 16px}
header a{color:#fff}
main{max-width:700px;margin:auto;padding:12px}
button{background:#ee4d2d;color:#fff;border:0;border-radius:6px;padding:10px 14px;font-size:16px;margin:2px}
button:disabled{opacity:.5}
input,textarea,select{width:100%;box-sizing:border-box;padding:10px;margin:4px 0 10px;border:1px solid #ccc;border-radius:6px;font:inherit}
select{width:auto;margin:4px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#fff;padding:10px;border-radius:8px;margin:8px 0}
.msg{padding:20px;text-align:center}
</style></head><body>
<header><b>Admin</b><span id='out'></span></header>
<main id='app'></main>
<script src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js'></script>
<script src='config.js'></script>
<script>
const C=window.CFG,$=s=>document.querySelector(s),app=$('#app');
const rp=n=>'Rp'+Number(n).toLocaleString('id-ID');
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/'/g,'&#39;').split(String.fromCharCode(34)).join('&quot;');
const db=supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY);
const msg=t=>{const m=$('#m');if(m)m.textContent=t};
let seller=null,P=[];

async function init(){const r=await db.auth.getSession();r.data.session?panel():login()}
function login(){
 $('#out').textContent='';
 app.innerHTML=`<form id='f'><input name='e' type='email' placeholder='Email' required><input name='p' type='password' placeholder='Kata sandi' required><button>Masuk</button><p id='m'></p></form>`;
 $('#f').onsubmit=async e=>{e.preventDefault();const r=await db.auth.signInWithPassword({email:e.target.e.value,password:e.target.p.value});if(r.error)msg(r.error.message);else panel()};
}
async function panel(){
 const u=(await db.auth.getUser()).data.user;
 $('#out').innerHTML=`<a href='#' id='lo'>Keluar</a>`;
 $('#lo').onclick=async e=>{e.preventDefault();await db.auth.signOut();login()};
 const r=await db.from('sellers').select('*').eq('owner_id',u.id).maybeSingle();
 if(!r.data){app.innerHTML=`<p class='msg'>Akun ${esc(u.email)} belum ditautkan ke toko.</p>`;return}
 seller=r.data;tab('produk');
}
function tab(t){app.innerHTML=`<p><button data-t='produk'>Produk</button><button data-t='pesanan'>Pesanan</button></p><div id='box'></div>`;t==='produk'?produk():pesanan();cekBaru()}
async function cekBaru(){
 if(!seller)return;
 const r=await db.from('orders').select('id',{count:'exact',head:true}).eq('seller_id',seller.id).eq('status','baru');
 if(r.error)return;
 const n=r.count||0,b=document.querySelector("button[data-t='pesanan']");
 if(b)b.textContent='Pesanan'+(n?' ('+n+' baru)':'');
 document.title=(n?'('+n+') ':'')+'Admin';
}
setInterval(cekBaru,30000);
async function produk(){
 const r=await db.from('products').select('*').eq('seller_id',seller.id).order('created_at',{ascending:false});
 if(r.error){$('#box').textContent=r.error.message;return}
 P=r.data;
 $('#box').innerHTML=`<button data-a='baru'>+ Produk baru</button>`+P.map(p=>`<div class='row'><span>${esc(p.name)}<br><small>${rp(p.price)} | stok ${p.stock} | ${p.is_active?'tayang':'disembunyikan'}</small></span><button data-a='edit' data-i='${p.id}'>Ubah</button></div>`).join('');
}
function form(p){
 p=p||{};
 $('#box').innerHTML=`<form id='pf'><input name='name' placeholder='Nama produk' value='${esc(p.name)}' required><textarea name='description' rows='3' placeholder='Deskripsi'>${esc(p.description)}</textarea><input name='price' type='number' min='0' placeholder='Harga (Rp)' value='${p.price==null?'':p.price}' required><input name='stock' type='number' min='0' placeholder='Stok' value='${p.stock==null?0:p.stock}' required><input name='file' type='file' accept='image/*'><label><input type='checkbox' name='is_active' style='width:auto' ${p.is_active===false?'':'checked'}> Tayang</label><br><button>Simpan</button><button type='button' data-a='batal'>Batal</button><p id='m'></p></form>`;
 $('#pf').onsubmit=async e=>{
  e.preventDefault();const el=e.target.elements,b=e.target.querySelector('button');b.disabled=true;
  try{
   let url=p.image_url||null;const file=el['file'].files[0];
   if(file){
    const path=seller.id+'/'+Date.now()+'-'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
    const up=await db.storage.from('produk').upload(path,file);if(up.error)throw up.error;
    url=db.storage.from('produk').getPublicUrl(path).data.publicUrl;
   }
   const row={seller_id:seller.id,name:el['name'].value.trim(),description:el['description'].value,price:+el['price'].value,stock:+el['stock'].value,image_url:url,is_active:el['is_active'].checked};
   const r=p.id?await db.from('products').update(row).eq('id',p.id):await db.from('products').insert(row);
   if(r.error)throw r.error;
   produk();
  }catch(err){msg(err.message);b.disabled=false}
 };
}
async function pesanan(){
 const r=await db.from('orders').select('*,order_items(name,qty,price)').eq('seller_id',seller.id).order('created_at',{ascending:false});
 if(r.error){$('#box').textContent=r.error.message;return}
 const st=['baru','dibayar','dikirim','selesai','batal'];
 $('#box').innerHTML=r.data.length?r.data.map(o=>`<div class='row' style='display:block'><b>${esc(o.buyer_name)}</b> ${esc(o.buyer_phone)}<br><small>${esc(o.address)}</small><br>${o.order_items.map(i=>i.qty+'x '+esc(i.name)).join(', ')}<br><b>${rp(o.total)}</b> <select data-o='${o.id}'>${st.map(s=>`<option${s===o.status?' selected':''}>${s}</option>`).join('')}</select></div>`).join(''):`<p class='msg'>Belum ada pesanan.</p>`;
}
app.onclick=e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.t)tab(d.t);else if(d.a==='baru')form();else if(d.a==='edit')form(P.find(x=>x.id===d.i));else if(d.a==='batal')produk()};
app.onchange=async e=>{const s=e.target.closest('select[data-o]');if(!s)return;const r=await db.from('orders').update({status:s.value}).eq('id',s.dataset.o);if(r.error){alert(r.error.message);pesanan()}cekBaru()};
init();
</script></body></html>
