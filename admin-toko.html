<!doctype html>
<html lang='id'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><meta name='robots' content='noindex'><title>Admin: Voucher, Varian, Foto, Flash sale, Warna</title>
<link rel='manifest' href='manifest-admin.webmanifest'><link rel='icon' href='ikon-admin-192.png' type='image/png'><link rel='apple-touch-icon' href='apple-touch-icon-admin.png'>
<link rel='stylesheet' href='style.css'>
<link rel='stylesheet' href='tema.css'>
<script src='tema.js'></script>
<style>main{max-width:720px;margin:auto;padding:1rem}table{width:100%;border-collapse:collapse}td,th{padding:.4rem;border-bottom:1px solid #eee;text-align:left;font-size:.9rem}.r{display:flex;flex-wrap:wrap;gap:.4rem}.r input,.r select{flex:1;min-width:110px}td input{width:6rem}.x{overflow-x:auto}.fg{display:flex;flex-wrap:wrap;gap:.5rem}.fk{width:110px;text-align:center}.fk img{width:110px;height:110px;object-fit:cover;border-radius:6px;display:block}.sws{display:flex;flex-wrap:wrap;gap:.6rem;margin:.5rem 0}.sws button{width:44px;height:44px;padding:0;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #bbb}.sws button[aria-pressed=true]{box-shadow:0 0 0 3px var(--tx)}</style></head><body>
<main id='m'><p class='msg'>Memuat...</p></main>
<script src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js'></script>
<script src='config.js'></script>
<script>
const C=window.CFG||{},$=s=>document.querySelector(s),m=$('#m'),db=supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp=n=>'Rp'+Number(n).toLocaleString('id-ID');
let tab='v',PID='',CUR=null,SID='';
const keluar=async()=>{await db.auth.signOut();init()};
const gagal=e=>{$('#c').innerHTML=`<p class='msg'>Gagal: ${esc(e.message)}</p>`};
function kecilkan(file){return new Promise((ok,no)=>{const im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{const k=Math.min(1,1600/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);URL.revokeObjectURL(u);cv.toBlob(b=>b?ok(b):no(new Error('Gagal memproses foto')),'image/jpeg',.85)};im.onerror=()=>no(new Error('Foto tidak bisa dibaca, coba JPG atau PNG'));im.src=u})}
function login(){
 m.innerHTML=`<form id='lf' class='fm box'><h2>Masuk penjual</h2><input name='e' type='email' placeholder='Email' required><input name='p' type='password' placeholder='Kata sandi' required><button>Masuk</button><p id='e'></p></form>`;
 $('#lf').onsubmit=async ev=>{ev.preventDefault();const f=ev.target,r=await db.auth.signInWithPassword({email:f.elements.e.value.trim(),password:f.elements.p.value});if(r.error){$('#e').textContent=r.error.message;return}init()};
}
async function init(){
 const s=(await db.auth.getSession()).data.session;
 if(!s)return login();
 const o=await db.from('sellers').select('id').eq('owner_id',s.user.id).limit(1).maybeSingle();
 if(!o.data){m.innerHTML=`<p class='msg'>Akun ini belum punya toko. <a href='./#/mulai-jualan'>Mulai jualan</a> | <a href='#' id='k'>Keluar</a></p>`;$('#k').onclick=e=>{e.preventDefault();keluar()};return}
 SID=o.data.id;
 m.innerHTML=`<p><a href='admin.html'>&larr; Admin utama</a> | <a href='#' id='k'>Keluar</a></p><div class='chips'><button data-t='v'>Voucher</button><button data-t='r'>Varian produk</button><button data-t='f'>Foto produk</button><button data-t='s'>Flash sale</button><button data-t='w'>Warna toko</button></div><div id='c'></div>`;
 $('#k').onclick=e=>{e.preventDefault();keluar()};
 m.querySelector('.chips').onclick=e=>{const b=e.target.closest('button');if(b){tab=b.dataset.t;tampil()}};
 m.onclick=aksi;
 tampil();
}
function tampil(){
 m.querySelectorAll('.chips button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
 ({v:voucherView,r:varianView,f:fotoView,s:flashView,w:warnaView}[tab]||voucherView)().catch(gagal);
}
async function voucherView(){
 const r=await db.from('voucher').select('*').eq('seller_id',SID).order('created_at',{ascending:false});
 if(r.error)return gagal(r.error);
 const baris=r.data.map(x=>`<tr data-id='${x.id}'><td><b>${esc(x.kode)}</b></td><td>${x.jenis==='persen'?x.nilai+'%':rp(x.nilai)}${x.maks_potongan?'<br><small>maks '+rp(x.maks_potongan)+'</small>':''}</td><td>${rp(x.min_belanja)}</td><td>${x.terpakai}/${x.kuota||'tak terbatas'}</td><td>${x.berlaku_sampai?new Date(x.berlaku_sampai).toLocaleDateString('id-ID'):'-'}</td><td>${'publik' in x?`<button class='line sm' data-a='pv' data-on='${x.publik}'>${x.publik?'Publik':'Privat'}</button> `:''}<button class='line sm' data-a='tv' data-on='${x.aktif}'>${x.aktif?'Aktif':'Mati'}</button> <button class='line sm' data-a='hv'>Hapus</button></td></tr>`).join('');
 $('#c').innerHTML=`<form id='fv' class='box fm'><h3>Tambah voucher</h3><div class='r'><input name='k' placeholder='Kode (mis. HEMAT10)' maxlength='30' required><select name='j'><option value='persen'>Persen (%)</option><option value='nominal'>Nominal (Rp)</option></select><input name='n' type='number' min='1' placeholder='Nilai' required></div><div class='r'><input name='mb' type='number' min='0' placeholder='Min. belanja (Rp)'><input name='mp' type='number' min='1' placeholder='Maks. potongan (Rp)'><input name='q' type='number' min='1' placeholder='Kuota'></div><label>Berlaku sampai (opsional)<input name='t' type='date'></label><label><input type='checkbox' name='pb' style='width:auto'> Tampilkan di Pusat Voucher (bisa diklaim semua pembeli)</label><small>Voucher publik butuh migrasi 0017. Voucher privat tetap bisa dipakai lewat kodenya.</small><button>Simpan</button><p id='e'></p></form>`+(r.data.length?`<div class='box x'><table><tr><th>Kode</th><th>Potongan</th><th>Min.</th><th>Terpakai</th><th>Sampai</th><th></th></tr>${baris}</table></div>`:`<p class='msg'>Belum ada voucher.</p>`);
 $('#fv').onsubmit=async ev=>{
  ev.preventDefault();const el=ev.target.elements;
  const row={seller_id:SID,kode:el.k.value.trim().toUpperCase(),jenis:el.j.value,nilai:+el.n.value,min_belanja:+el.mb.value||0,maks_potongan:+el.mp.value||null,kuota:+el.q.value||null,berlaku_sampai:el.t.value?new Date(el.t.value+'T23:59:59').toISOString():null};
  if(el.pb.checked)row.publik=true;
  const w=await db.from('voucher').insert(row);
  if(w.error){$('#e').textContent=w.error.message;return}
  tampil();
 };
}
async function varianView(){
 const p=await db.from('products').select('id,name,stock').eq('seller_id',SID).order('name');
 if(p.error)return gagal(p.error);
 if(!p.data.length){$('#c').innerHTML=`<p class='msg'>Belum ada produk.</p>`;return}
 if(!p.data.some(x=>x.id===PID))PID=p.data[0].id;
 const v=await db.from('varian').select('*').eq('product_id',PID).order('urut').order('nama');
 if(v.error)return gagal(v.error);
 const baris=v.data.map(x=>`<tr data-id='${x.id}'><td>${esc(x.nama)}</td><td><input type='number' min='1' value='${x.harga||''}' placeholder='harga produk' data-f='h'></td><td><input type='number' min='0' value='${x.stok}' data-f='s'></td><td><button class='line sm' data-a='sv'>Simpan</button> <button class='line sm' data-a='hv2'>Hapus</button></td></tr>`).join('');
 $('#c').innerHTML=`<div class='box fm'><select id='pp' aria-label='Produk'>${p.data.map(x=>`<option value='${x.id}'${x.id===PID?' selected':''}>${esc(x.name)}</option>`).join('')}</select><small>Jika produk punya varian, stok produk otomatis = jumlah stok semua varian.</small></div><form id='fr' class='box fm'><h3>Tambah varian</h3><div class='r'><input name='n' placeholder='Nama (mis. Merah / L)' maxlength='60' required><input name='h' type='number' min='1' placeholder='Harga (kosong = harga produk)'><input name='s' type='number' min='0' placeholder='Stok' required></div><button>Simpan</button><p id='e'></p></form>`+(v.data.length?`<div class='box x'><table><tr><th>Varian</th><th>Harga</th><th>Stok</th><th></th></tr>${baris}</table></div>`:`<p class='msg'>Produk ini belum punya varian.</p>`);
 $('#pp').onchange=ev=>{PID=ev.target.value;tampil()};
 $('#fr').onsubmit=async ev=>{
  ev.preventDefault();const el=ev.target.elements;
  const w=await db.from('varian').insert({product_id:PID,nama:el.n.value.trim(),harga:+el.h.value||null,stok:+el.s.value});
  if(w.error){$('#e').textContent=w.error.message;return}
  tampil();
 };
}
async function fotoView(){
 const p=await db.from('products').select('id,name,image_url,seller_id').eq('seller_id',SID).order('name');
 if(p.error)return gagal(p.error);
 if(!p.data.length){$('#c').innerHTML=`<p class='msg'>Belum ada produk.</p>`;return}
 if(!p.data.some(x=>x.id===PID))PID=p.data[0].id;
 CUR=p.data.find(x=>x.id===PID);
 const f=await db.from('produk_foto').select('id,url').eq('product_id',PID).order('urut').order('created_at');
 if(f.error)return gagal(f.error);
 const tambahan=f.data.map(x=>`<div class='fk' data-id='${x.id}' data-u='${esc(x.url)}'><img src='${esc(x.url)}' alt='' loading='lazy'><button class='line sm' data-a='fu'>Jadikan utama</button> <button class='line sm' data-a='fh'>Hapus</button></div>`).join('');
 $('#c').innerHTML=`<div class='box fm'><select id='pp' aria-label='Produk'>${p.data.map(x=>`<option value='${x.id}'${x.id===PID?' selected':''}>${esc(x.name)}</option>`).join('')}</select><small>Foto utama tampil di kartu produk. Foto tambahan (maks. 8) tampil sebagai galeri di halaman detail.</small></div><div class='box'><h3>Foto utama</h3>${CUR.image_url?`<div class='fk'><img src='${esc(CUR.image_url)}' alt=''></div>`:`<p class='msg'>Belum ada foto utama (atur di admin utama).</p>`}</div><div class='box fm'><h3>Foto tambahan (${f.data.length}/8)</h3><div class='fg'>${tambahan||`<p class='msg'>Belum ada foto tambahan.</p>`}</div><label class='btn'>Tambah foto<input id='fi' type='file' accept='image/*' multiple hidden></label><p id='e'></p></div>`;
 $('#pp').onchange=ev=>{PID=ev.target.value;tampil()};
 $('#fi').onchange=async ev=>{
  const files=[...ev.target.files],sisa=8-f.data.length,e=$('#e');
  if(!files.length)return;
  if(files.length>sisa){e.textContent='Sisa tempat foto: '+sisa;return}
  e.textContent='Mengunggah...';
  try{
   for(let i=0;i<files.length;i++){
    const blob=await kecilkan(files[i]),path=CUR.seller_id+'/'+Date.now()+'-'+i+'.jpg';
    const up=await db.storage.from('produk').upload(path,blob,{contentType:'image/jpeg'});if(up.error)throw up.error;
    const url=db.storage.from('produk').getPublicUrl(path).data.publicUrl;
    const w=await db.from('produk_foto').insert({product_id:PID,url:url,urut:f.data.length+i});if(w.error)throw w.error;
   }
  }catch(x){e.textContent='Gagal: '+x.message;return}
  tampil();
 };
}
function hariIni(d){const x=new Date(d.getTime()-d.getTimezoneOffset()*60000);return x.toISOString().slice(0,16)}
async function flashView(){
 const p=await db.from('products').select('id,name,price,flash_persen,flash_mulai,flash_selesai').eq('seller_id',SID).order('name');
 if(p.error)return gagal(p.error);
 if(!p.data.length){$('#c').innerHTML=`<p class='msg'>Belum ada produk.</p>`;return}
 if(!p.data.some(x=>x.id===PID))PID=p.data[0].id;
 const now=Date.now(),aktif=p.data.filter(x=>x.flash_persen);
 const tgl=s=>new Date(s).toLocaleString('id-ID',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
 const baris=aktif.map(x=>{
  const jalan=now>=Date.parse(x.flash_mulai)&&now<Date.parse(x.flash_selesai),usai=now>=Date.parse(x.flash_selesai);
  return `<tr data-id='${x.id}'><td>${esc(x.name)}</td><td>-${x.flash_persen}%<br><small>${rp(Math.max(1,Math.floor((x.price*(100-x.flash_persen)+50)/100)))}</small></td><td><small>${tgl(x.flash_mulai)}<br>${tgl(x.flash_selesai)}</small></td><td>${jalan?'Berjalan':usai?'Selesai':'Terjadwal'}</td><td><button class='line sm' data-a='sf'>Hentikan</button></td></tr>`;
 }).join('');
 const mulai=hariIni(new Date()),selesai=hariIni(new Date(Date.now()+86400000));
 $('#c').innerHTML=`<form id='ff' class='box fm'><h3>Atur flash sale</h3><select name='p' aria-label='Produk'>${p.data.map(x=>`<option value='${x.id}'${x.id===PID?' selected':''}>${esc(x.name)} (${rp(x.price)})</option>`).join('')}</select><div class='r'><input name='n' type='number' min='1' max='90' placeholder='Potongan (%)' required></div><label>Mulai<input name='a' type='datetime-local' value='${mulai}' required></label><label>Selesai<input name='b' type='datetime-local' value='${selesai}' required></label><small>Potongan berlaku juga untuk harga varian. Harga akhir dihitung server saat pesanan dibuat.</small><button>Simpan</button><p id='e'></p></form>`+(aktif.length?`<div class='box x'><table><tr><th>Produk</th><th>Diskon</th><th>Waktu</th><th>Status</th><th></th></tr>${baris}</table></div>`:`<p class='msg'>Belum ada flash sale.</p>`);
 $('#ff').onsubmit=async ev=>{
  ev.preventDefault();const el=ev.target.elements,a=new Date(el.a.value),b=new Date(el.b.value);
  if(!(b>a)){$('#e').textContent='Waktu selesai harus setelah waktu mulai';return}
  PID=el.p.value;
  const w=await db.from('products').update({flash_persen:+el.n.value,flash_mulai:a.toISOString(),flash_selesai:b.toISOString()}).eq('id',PID);
  if(w.error){$('#e').textContent=w.error.message;return}
  tampil();
 };
}
/* Warna utama toko: disimpan di kolom sellers.warna (migrasi 0018). Etalase membacanya lewat tema.js. */
const SW=[['Violet','#5b3cc4'],['Biru','#1d4ed8'],['Hijau tosca','#0f766e'],['Merah muda','#be185d'],['Marun','#9f1239'],['Cokelat','#92400e'],['Abu gelap','#334155']];
async function warnaView(){
 const o=await db.from('sellers').select('id,warna').eq('id',SID).maybeSingle();
 if(o.error){$('#c').innerHTML=`<p class='msg'>Kolom warna belum ada. Jalankan migrasi 0018_warna_toko.sql di Supabase, lalu muat ulang halaman ini.</p>`;return}
 const cur=TEMA.ok(o.data.warna)?o.data.warna.toLowerCase():TEMA.DEF;
 $('#c').innerHTML=`<form id='fw' class='box fm'><h3>Warna utama toko</h3><small>Dipakai untuk header, tombol, harga, dan ikon di etalase. Aksen kuning tetap. Halaman ini ikut berubah sebagai contoh sebelum disimpan.</small><div class='sws'>${SW.map(x=>`<button type='button' data-w='${x[1]}' style='background:${x[1]}' aria-label='${x[0]}' aria-pressed='false'></button>`).join('')}</div><label>Pilih warna<input name='c' type='color' value='${cur}' style='height:44px;padding:2px'></label><label>Kode warna<input name='h' value='${cur}' maxlength='7' autocomplete='off'></label><small id='nt'></small><div class='box' style='padding:0;overflow:hidden'><div style='background:var(--o);color:#fff;padding:.7rem;display:flex;gap:.5rem;align-items:center;justify-content:space-between'><span>Cari produk</span><span style='background:#f5b301;color:#2b1b00;border-radius:8px;padding:.2rem .7rem;font-weight:700'>Cari</span></div><div style='padding:.7rem'><b class='price'>Rp150.000</b> <button type='button'>Beli</button></div></div><button>Simpan warna</button> <button type='button' class='line' data-a='wr'>Kembali ke bawaan</button><p id='e'></p></form>`;
 const fw=$('#fw'),el=fw.elements;
 const ubah=h=>{
  h=h.toLowerCase();if(!TEMA.ok(h))return;
  el.c.value=h;el.h.value=h;TEMA.pasang(h);
  const t=TEMA.turunan(h);
  $('#nt').textContent=t.o!==h?'Warna digelapkan sedikit menjadi '+t.o+' agar teks putih tetap terbaca.':'';
  fw.querySelectorAll('[data-w]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.w===h)));
 };
 fw.onclick=ev=>{const b=ev.target.closest('[data-w]');if(b)ubah(b.dataset.w)};
 el.c.oninput=()=>ubah(el.c.value);
 el.h.oninput=()=>{const v=el.h.value.trim();if(TEMA.ok(v))ubah(v)};
 ubah(cur);
 fw.onsubmit=async ev=>{
  ev.preventDefault();
  const h=el.h.value.trim().toLowerCase(),e=$('#e');
  if(!TEMA.ok(h)){e.textContent='Kode warna harus seperti #5b3cc4';return}
  const w=await db.from('sellers').update({warna:h}).eq('id',SID).select('id');
  if(w.error){e.textContent=w.error.message;return}
  if(!w.data.length){e.textContent='Tidak diizinkan mengubah warna toko';return}
  TEMA.pasang(h,true);
  e.textContent='Tersimpan. Etalase memakai warna baru saat dimuat ulang.';
 };
}
async function aksi(ev){
 const b=ev.target.closest('button[data-a]');if(!b)return;
 const tr=b.closest('tr'),fk=b.closest('.fk'),id=(tr&&tr.dataset.id)||(fk&&fk.dataset.id),a=b.dataset.a;let r;
 b.disabled=true;
 if(a==='tv')r=await db.from('voucher').update({aktif:b.dataset.on!=='true'}).eq('id',id);
 else if(a==='pv')r=await db.from('voucher').update({publik:b.dataset.on!=='true'}).eq('id',id);
 else if(a==='hv'){if(!confirm('Hapus voucher ini?')){b.disabled=false;return}r=await db.from('voucher').delete().eq('id',id)}
 else if(a==='hv2'){if(!confirm('Hapus varian ini?')){b.disabled=false;return}r=await db.from('varian').delete().eq('id',id)}
 else if(a==='sv')r=await db.from('varian').update({harga:+tr.querySelector('[data-f=h]').value||null,stok:+tr.querySelector('[data-f=s]').value}).eq('id',id);
 else if(a==='sf')r=await db.from('products').update({flash_persen:null,flash_mulai:null,flash_selesai:null}).eq('id',id);
 else if(a==='wr'){
  r=await db.from('sellers').update({warna:null}).eq('id',SID).select('id');
  if(!r.error&&!r.data.length)r={error:{message:'Tidak diizinkan mengubah warna toko'}};
  if(!r.error)TEMA.pasang(TEMA.DEF,true);
 }
 else if(a==='fh'){
  if(!confirm('Hapus foto ini?')){b.disabled=false;return}
  const u=fk.dataset.u,i=u.indexOf('/object/public/produk/');
  if(i>=0)await db.storage.from('produk').remove([decodeURIComponent(u.slice(i+22))]);
  r=await db.from('produk_foto').delete().eq('id',id);
 }
 else if(a==='fu'){
  const baru=fk.dataset.u,lama=CUR&&CUR.image_url;
  r=await db.from('products').update({image_url:baru}).eq('id',PID);
  if(!r.error)r=lama?await db.from('produk_foto').update({url:lama}).eq('id',id):await db.from('produk_foto').delete().eq('id',id);
 }
 if(r&&r.error){alert(r.error.message);b.disabled=false;return}
 tampil();
}
init();
</script></body></html>
